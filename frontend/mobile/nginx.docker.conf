server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # PDF.js 4.x loads its worker as an ES module.  Nginx does not include
    # .mjs in all default mime.types files, so make the module type explicit.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
