<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f9fd" />
    <title>Pulse</title>
    <link rel="icon" type="image/png" href="./pulse-logo.png" />
  </head>
  <body>
    <div id="app">
      <div class="desktop-bootstrap-loading" role="status" aria-live="polite">
        <div class="desktop-bootstrap-mark"><span></span><span></span><span></span></div>
        <strong>正在打开 Pulse</strong>
        <span>正在加载桌面空间…</span>
      </div>
    </div>
    <style>
      html, body { min-height: 100%; margin: 0; background: #f6f9fd; }
      .desktop-bootstrap-loading { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; color: #63748a; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .desktop-bootstrap-loading strong { color: #20334d; font-size: 18px; }
      .desktop-bootstrap-mark { display: flex; align-items: center; justify-content: center; gap: 3px; width: 48px; height: 48px; border-radius: 15px; background: linear-gradient(145deg, #2fa4eb, #126fc4); box-shadow: 0 10px 24px rgba(18, 111, 196, .24); }
      .desktop-bootstrap-mark span { display: block; width: 4px; border-radius: 5px; background: #fff; transform: skew(-18deg); }
      .desktop-bootstrap-mark span:nth-child(1) { height: 14px; opacity: .78; }
      .desktop-bootstrap-mark span:nth-child(2) { height: 24px; }
      .desktop-bootstrap-mark span:nth-child(3) { height: 18px; opacity: .88; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
