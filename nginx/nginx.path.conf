map $http_upgrade $pulse_connection_upgrade {
    default upgrade;
    '' close;
}

upstream pulse_path_api {
    server 127.0.0.1:18080;
}

upstream pulse_path_im {
    server 127.0.0.1:19001;
}

upstream pulse_path_mobile {
    server 127.0.0.1:18082;
}

upstream pulse_path_admin {
    server 127.0.0.1:18083;
}

server {
    listen 9001 ssl;
    listen [::]:9001 ssl;
    server_name _;

    ssl_certificate /etc/nginx/pulseim/pulse.crt;
    ssl_certificate_key /etc/nginx/pulseim/pulse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 120m;

    location = /pulseim {
        return 301 /pulseim/;
    }

    location = /pulseim/desktop {
        return 301 /pulseim/desktop/;
    }

    # Do not use ^~ here: the .mjs regex below must be able to override the
    # default application/octet-stream MIME type for the PDF.js worker.
    location /pulseim/desktop/ {
        alias /opt/pulseim/current/desktop-web/;
        index index.html;
        try_files $uri $uri/ /pulseim/desktop/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* ^/pulseim/desktop/(.+\.mjs)$ {
        alias /opt/pulseim/current/desktop-web/$1;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /pulseim/downloads/ {
        alias /opt/pulseim/downloads/;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ^~ /pulseim/api/ {
        proxy_pass http://pulse_path_api/api/;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pulseim;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /pulseim/ws {
        proxy_pass http://pulse_path_im/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pulse_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /pulseim/admin/ {
        proxy_pass http://pulse_path_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pulseim/ {
        proxy_pass http://pulse_path_mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
