map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream pulse_server_api {
    server 127.0.0.1:18080;
}

upstream pulse_server_im {
    server 127.0.0.1:19001;
}

upstream pulse_server_mobile {
    server 127.0.0.1:18082;
}

upstream pulse_server_admin {
    server 127.0.0.1:18083;
}

server {
    listen 9001 ssl;
    server_name 110.42.238.238 _;

    ssl_certificate /etc/nginx/pulseim/pulse.crt;
    ssl_certificate_key /etc/nginx/pulseim/pulse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 120m;

    location ~ ^/api/v1/files/raw/([A-Za-z0-9._-]+\.apk)$ {
        alias /opt/pulseim/data/uploads/$1;
        default_type application/vnd.android.package-archive;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-transform" always;
    }

    location /api/ {
        proxy_pass http://pulse_server_api;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backward-compatible API path for older desktop clients.
    location /pulseim/api/ {
        proxy_pass http://pulse_server_api/api/;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://pulse_server_im;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backward-compatible WebSocket path for older desktop clients.
    location /pulseim/ws {
        proxy_pass http://pulse_server_im/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://pulse_server_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /desktop {
        return 301 /desktop/;
    }

    # PDF.js 4.x loads its worker as an ES module. Keep the regex location
    # reachable so Chromium receives JavaScript instead of octet-stream.
    location /desktop/assets/ {
        root /opt/pulseim;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/desktop/assets/.*\.mjs$ {
        root /opt/pulseim;
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /desktop/ {
        root /opt/pulseim;
        try_files $uri $uri/ /desktop/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://pulse_server_mobile;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
