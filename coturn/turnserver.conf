# PulseIM coturn — 生产 TURN/STUN 中继
# 安全组需放行: 3478/tcp、3478/udp、49160-49200/udp

listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
realm=pulseim

# REST 短期凭据模式：密钥由 docker-compose 通过 --static-auth-secret 注入，
# 后端按用户生成 1 小时有效的 username/credential，不再下发静态账号
use-auth-secret

# 公网 IP（ECS）；若有「内网IP/公网IP」双栈可写成 internal/external
external-ip=117.72.220.127

no-cli
no-tls
no-dtls
no-multicast-peers
no-stdout-log
log-file=stdout
simple-log
