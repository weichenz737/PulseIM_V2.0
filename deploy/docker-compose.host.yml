services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: pulse-postgres
    environment:
      POSTGRES_DB: pulseim
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - /opt/pulseim/data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulseim"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: pulse-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /opt/pulseim/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: pulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - /opt/pulseim/data/minio:/data
    ports:
      - "127.0.0.1:19090:9000"
      - "127.0.0.1:19091:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  coturn:
    image: docker.m.daocloud.io/coturn/coturn:4.6.2
    container_name: pulse-coturn
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret", "${TURN_CREDENTIAL:?TURN_CREDENTIAL is required}"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  pulse-api:
    build:
      context: ./artifacts/api
      dockerfile: Dockerfile
    container_name: pulse-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseim
      DB_USER: pulse
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SPRING_PROFILES_ACTIVE: prod
      SMS_DEV_FIXED_CODE: "1234"
      ALLOW_FIXED_SMS_CODE: "true"
      SCHEMA_FAIL_FAST: "true"
      PULSE_UPLOAD_DIR: /app/uploads
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-pulse-avatar}
      MINIO_FILE_BUCKET: ${MINIO_FILE_BUCKET:-pulse-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://minio:9000/pulse-avatar}
      PULSE_DOCUMENT_PREVIEW_ENABLED: ${PULSE_DOCUMENT_PREVIEW_ENABLED:-true}
      LIBREOFFICE_PATH: ${LIBREOFFICE_PATH:-soffice}
      PULSE_DOCUMENT_PREVIEW_MAX_SOURCE_BYTES: ${PULSE_DOCUMENT_PREVIEW_MAX_SOURCE_BYTES:-104857600}
      PULSE_DOCUMENT_PREVIEW_TIMEOUT_SECONDS: ${PULSE_DOCUMENT_PREVIEW_TIMEOUT_SECONDS:-90}
      WPS_WEBOFFICE_ENABLED: ${WPS_WEBOFFICE_ENABLED:-false}
      WPS_WEBOFFICE_APP_ID: ${WPS_WEBOFFICE_APP_ID:-}
      WPS_WEBOFFICE_APP_SECRET: ${WPS_WEBOFFICE_APP_SECRET:-}
      WPS_WEBOFFICE_PUBLIC_BASE_URL: ${WPS_WEBOFFICE_PUBLIC_BASE_URL:-}
      WPS_WEBOFFICE_TOKEN_SECRET: ${WPS_WEBOFFICE_TOKEN_SECRET:-}
      WPS_WEBOFFICE_SDK_URL: ${WPS_WEBOFFICE_SDK_URL:-/vendor/wps/web-office-sdk-solution.umd.js}
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      BAIDU_MAP_APP_AK: ${BAIDU_MAP_APP_AK:-}
      TURN_URLS: "turn:110.42.238.238:3478?transport=udp,turn:110.42.238.238:3478?transport=tcp"
      TURN_USERNAME: pulse
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:?TURN_CREDENTIAL is required}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /opt/pulseim/data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  pulse-im:
    build:
      context: ./artifacts/im
      dockerfile: Dockerfile
    container_name: pulse-im
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseim
      DB_USER: pulse
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IM_PORT: 9001
      IM_NODE_ID: im-1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9001'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mobile:
    build:
      context: ./artifacts/mobile
      dockerfile: Dockerfile
    container_name: pulse-mobile
    depends_on:
      pulse-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./artifacts/admin
      dockerfile: Dockerfile
    container_name: pulse-admin
    depends_on:
      pulse-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
