services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_connections=150"
    environment:
      POSTGRES_DB: pulseim
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse123
    ports:
      - "5432:5432"
    volumes:
      - pulse_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulseim"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - pulse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: pulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19090:9000"
      - "19091:9001"
    volumes:
      - pulse_minio:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.m.daocloud.io/elastic/elasticsearch:8.15.3
    container_name: pulse-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - pulse_es:/usr/share/elasticsearch/data
    profiles: ["full"]
    restart: unless-stopped

  pulse-api:
    build:
      context: ../backend
      dockerfile: ../docker/api/Dockerfile
    container_name: pulse-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseim
      DB_USER: pulse
      DB_PASSWORD: pulse123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: pulse-avatar
      MINIO_PUBLIC_URL: http://localhost:19090/pulse-avatar
      JWT_SECRET: pulse-im-jwt-secret-key-change-me-32bytes!!
      ES_URIS: http://elasticsearch:9200
      BAIDU_MAP_AK: ${BAIDU_MAP_AK}
    ports:
      - "8080:8080"
    volumes:
      - pulse_uploads:/app/uploads
    restart: unless-stopped

  pulse-im:
    build:
      context: ../backend
      dockerfile: ../docker/im/Dockerfile
    container_name: pulse-im
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulse-api:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseim
      DB_USER: pulse
      DB_PASSWORD: pulse123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IM_PORT: 9001
      IM_NODE_ID: im-1
      JWT_SECRET: pulse-im-jwt-secret-key-change-me-32bytes!!
    ports:
      - "9001:9001"
    restart: unless-stopped

  mobile:
    build:
      context: ../frontend/mobile
      dockerfile: Dockerfile
    container_name: pulse-mobile
    depends_on:
      - pulse-api
    restart: unless-stopped

  admin:
    build:
      context: ../frontend/admin
      dockerfile: Dockerfile
    container_name: pulse-admin
    depends_on:
      - pulse-api
    restart: unless-stopped

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: pulse-nginx
    depends_on:
      - pulse-api
      - pulse-im
      - mobile
      - admin
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - pulse_uploads:/srv/pulse-uploads:ro
    restart: unless-stopped

volumes:
  pulse_pg:
  pulse_minio:
  pulse_redis:
  pulse_es:
  pulse_uploads:
