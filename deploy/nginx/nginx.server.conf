map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream pulse_server_api {
    server 127.0.0.1:18080;
}

upstream pulse_server_im {
    server 127.0.0.1:19001;
}

upstream pulse_server_mobile {
    server 127.0.0.1:18082;
}

upstream pulse_server_admin {
    server 127.0.0.1:18083;
}

server {
    listen 9001 ssl;
    server_name 110.42.238.238 _;

    ssl_certificate /etc/nginx/pulseim/pulse.crt;
    ssl_certificate_key /etc/nginx/pulseim/pulse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 120m;

    # Desktop assets are fingerprinted by Vite. Compress them on the wire and
    # let browsers keep immutable files between page loads; index.html remains
    # no-cache below so a new deployment is picked up immediately.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/javascript;

    location ~ ^/api/v1/files/raw/([A-Za-z0-9._-]+\.apk)$ {
        alias /opt/pulseim/data/uploads/$1;
        default_type application/vnd.android.package-archive;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-transform" always;
    }

    location ^~ /pulseim/downloads/ {
        alias /opt/pulseim/downloads/;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location /api/ {
        proxy_pass http://pulse_server_api;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:9001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backward-compatible API path for older desktop clients.
    location /pulseim/api/ {
        proxy_pass http://pulse_server_api/api/;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:9001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://pulse_server_im;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backward-compatible WebSocket path for older desktop clients.
    location /pulseim/ws {
        proxy_pass http://pulse_server_im/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/ {
        return 301 /pulseim$uri$is_args$args;
    }

    location ^~ /pulseim/admin/ {
        proxy_pass http://pulse_server_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /desktop {
        return 301 /desktop/;
    }

    location = /pulseim/desktop {
        return 301 /pulseim/desktop/;
    }

    # Keep the regex .mjs location below reachable so PDF.js receives a
    # JavaScript module MIME type instead of application/octet-stream.
    location /desktop/assets/ {
        root /opt/pulseim;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/desktop/assets/(.+\.mjs)$ {
        root /opt/pulseim;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /pulseim/desktop/assets/ {
        alias /opt/pulseim/desktop/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/pulseim/desktop/assets/(.+\.mjs)$ {
        alias /opt/pulseim/desktop/assets/$1;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /desktop/ {
        root /opt/pulseim;
        try_files $uri $uri/ /desktop/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /pulseim/desktop/ {
        alias /opt/pulseim/desktop/;
        try_files $uri $uri/ /pulseim/desktop/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # The mobile bundle is built with /pulseim/ asset and same-origin API URLs.
    # Strip the public prefix before proxying so the mobile Nginx serves the
    # underlying /assets and SPA paths instead of falling back to index.html.
    location = /pulseim {
        return 301 /pulseim/;
    }

    location ^~ /pulseim/ {
        proxy_pass http://pulse_server_mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://pulse_server_mobile;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
