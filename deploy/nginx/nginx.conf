user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream pulse_api {
        server pulse-api:8080;
    }

    upstream pulse_im {
        server pulse-im:9001;
    }

    upstream pulse_mobile {
        server mobile:80;
    }

    upstream pulse_admin {
        server admin:80;
    }

    server {
        listen 80;
        server_name _;

        location ~ ^/api/v1/files/raw/([A-Za-z0-9._-]+\.apk)$ {
            alias /srv/pulse-uploads/$1;
            default_type application/vnd.android.package-archive;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-transform" always;
        }

        location /api/ {
            proxy_pass http://pulse_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://pulse_im;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /admin/ {
            proxy_pass http://pulse_admin/;
            proxy_set_header Host $host;
            # SPA 入口必须每次校验；带哈希的 assets 由下游长期缓存。
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location / {
            proxy_pass http://pulse_mobile;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
