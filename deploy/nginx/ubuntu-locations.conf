client_max_body_size 1025m;

location = / { return 302 /pulseim/; }
location = /pulseim { return 301 /pulseim/; }
location = /pulseim/admin { return 301 /pulseim/admin/; }
location = /pulseim/desktop { return 301 /pulseim/desktop/; }

location /pulseim/desktop/ {
    proxy_pass http://127.0.0.1:18084/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /pulseim/admin/ {
    proxy_pass http://127.0.0.1:18083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /pulseim/api/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /pulseim;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
# Bundled Android clients configure an origin without the web deployment prefix.
location /api/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location /pulseim/ws {
    proxy_pass http://127.0.0.1:19001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pulseim_connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}
location /ws {
    proxy_pass http://127.0.0.1:19001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pulseim_connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}
location /pulseim/storage/pulse-avatar/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:19090/pulse-avatar/;
    proxy_set_header Host $host;
}
location /pulseim/downloads/ {
    alias /opt/pulseim/downloads/;
    add_header Content-Disposition "attachment" always;
}
location /pulseim/ {
    proxy_pass http://127.0.0.1:18082/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
