user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 120m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker 内置 DNS：上游容器重建后动态解析，避免 IP 缓存串路由
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream pulse_api {
        server pulse-api:8080;
    }

    upstream pulse_im {
        server pulse-im:9001;
    }

    # 公共代理片段通过 include 不便，复制两份 server 块
    server {
        listen 80;
        server_name _;

        location ~ ^/api/v1/files/raw/([A-Za-z0-9._-]+\.apk)$ {
            alias /srv/pulse-uploads/$1;
            default_type application/vnd.android.package-archive;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-transform" always;
        }

        location /api/ {
            proxy_pass http://pulse_api;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws {
            proxy_pass http://pulse_im;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 变量 proxy_pass 不会按 location 前缀剥离 URI，需 rewrite 去掉 /admin
        location /admin/ {
            set $pulse_admin_upstream admin;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$pulse_admin_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $pulse_mobile_upstream mobile;
            proxy_pass http://$pulse_mobile_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS：摄像头 / 麦克风 / WebRTC 必需安全上下文
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/pulse.crt;
        ssl_certificate_key /etc/nginx/certs/pulse.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location ~ ^/api/v1/files/raw/([A-Za-z0-9._-]+\.apk)$ {
            alias /srv/pulse-uploads/$1;
            default_type application/vnd.android.package-archive;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-transform" always;
        }

        location /api/ {
            proxy_pass http://pulse_api;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws {
            proxy_pass http://pulse_im;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /admin/ {
            set $pulse_admin_upstream admin;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$pulse_admin_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $pulse_mobile_upstream mobile;
            proxy_pass http://$pulse_mobile_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
